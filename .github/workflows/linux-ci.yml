name: Linux build and test
run-name: "Linux build and test ${{ inputs.leg || github.event_name }} ${{ inputs.racecar_run }}"
on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: baseline
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
    branches:
    - 'master'
    - 'stable/*'
  pull_request:
    branches:
    - '**'
  release:
    types:
    - created


permissions:
  contents: read
  id-token: write
env:
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}
jobs:
  test:
    name: Run tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
        build_static: [true, false]
        flags: [ADD_CXXFLAGS=-fvisibility=hidden]
        download_requirements: [sudo apt install -y -qq gfortran liblapack-dev libmetis-dev libnauty-dev]
    steps:
    - name: Checkout source
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        path: ${{ github.event.repository.name }}
    - name: Install required packages from package manager
      run: ${{ matrix.download_requirements }}
    - name: Checkout coinbrew
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        repository: coin-or/coinbrew
        path: coinbrew
    - name: Build project
      run: |
        export ${{ matrix.flags }}
        ADD_ARGS=()
        ADD_ARGS+=( --skip='ThirdParty/Metis ThirdParty/Mumps ThirdParty/Blas ThirdParty/Lapack' )
        ADD_BUILD_ARGS=()
        ADD_BUILD_ARGS+=( --tests main --enable-relocatable )
        ADD_BUILD_ARGS+=( --verbosity 2 )
        [[ ${{ matrix.build_static }} == "true" ]] && \
        ADD_BUILD_ARGS+=( --disable-shared )
        bash coinbrew/coinbrew fetch ${{ github.event.repository.name }} --skip-update \
        "${ADD_ARGS[@]}"
        bash coinbrew/coinbrew build ${{ github.event.repository.name }} \
        "${ADD_ARGS[@]}" "${ADD_BUILD_ARGS[@]}" \
        ADD_CXXFLAGS="${ADD_CXXFLAGS}" CC=${CC} CXX=${CXX}
        [[ ${CC} ]] && CC="${CC}" || CC=""
        echo "CC=${CC}" >> $GITHUB_ENV
    - name: Archive dist contents
      run: |
        cp ${{ github.event.repository.name }}/README.md dist/
        cp ${{ github.event.repository.name }}/LICENSE dist/
        tar -czvf release.tar.gz -C dist .
    - name: Checkout package name generation script
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        lfs: false
        repository: coin-or-tools/platform-analysis-tools
        path: tools
        ref: 0.0.2
    - name: Retrieve platform info
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install -r tools/requirements.txt
        [[ ${{ matrix.build_static }} == "true" ]] && buildtype=static || buildtype=
        platform_str=`python3 tools/hsf_get_platform.py -b $buildtype`
        echo "platform_string=${platform_str}" >> $GITHUB_ENV
    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: ${{ github.event.repository.name }}-${{ env.platform_string }}.tar.gz
        path: release.tar.gz
        if-no-files-found: error
    - name: Upload package to release
      continue-on-error: true     # racecar: scan/report/push step, must not fail the build
      if: ${{ github.event_name == 'release'}}
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./release.tar.gz
        asset_name: ${{ github.event.repository.name }}-${{ github.event.release.tag_name }}-${{ env.platform_string }}.tar.gz
        asset_content_type: application/gzip
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
